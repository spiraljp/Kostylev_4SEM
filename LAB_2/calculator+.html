<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор · Grid‑система планирования</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div id="result">0</div>

        <div class="buttons">
            <div class="button-row">
                <button id="btn_op_clear">C</button>
                <button id="btn_op_sign">+/-</button>
                <button id="btn_op_percent">%</button>
                <button id="btn_op_div">/</button>
            </div>
            <div class="button-row">
                <button id="btn_op_sqrt">√</button>
                <button id="btn_op_square">x²</button>
                <button id="btn_op_fact">x!</button>
                <button id="btn_op_mult">x</button>
            </div>
            <div class="button-row">
                <button id="btn_digit_7">7</button>
                <button id="btn_digit_8">8</button>
                <button id="btn_digit_9">9</button>
                <button id="btn_op_minus">-</button>
            </div>
            <div class="button-row">
                <button id="btn_digit_4">4</button>
                <button id="btn_digit_5">5</button>
                <button id="btn_digit_6">6</button>
                <button id="btn_op_plus">+</button>
            </div>
            <div class="button-row">
                <button id="btn_digit_1">1</button>
                <button id="btn_digit_2">2</button>
                <button id="btn_digit_3">3</button>
                <button id="btn_op_backspace">⌫</button>
            </div>
            <div class="button-row">
                <button id="btn_digit_0">0</button>
                <button id="btn_digit_000">000</button>
                <button id="btn_digit_dot">.</button>
                <button id="btn_op_equal">=</button>
            </div>
        </div>

        <div class="extra-controls">
            <a href="https://github.com/spiraljp" target="_blank" rel="noopener">GitHub</a>

            <div class="dropdown-container">
                <label for="node-select">узел:</label>
                <select id="node-select">
                    <option value="node1">Узел 1 (приор. высокий)</option>
                    <option value="node2">Узел 2 (средний)</option>
                    <option value="node3">Узел 3 (низкий)</option>
                    <option value="node4">Узел 4 (резерв)</option>
                </select>
            </div>

            <button id="theme-toggle">🌙 Тёмная</button>
        </div>

        <details>
            <summary>Автор</summary>
            <p>ФИО: Костылев Михаил Сергеевич</p>
            <p>Группа: ИУ5‑45Б</p>
        </details>

        <div class="goal">
            <strong>Цель ЛР:</strong> <mark>знакомство</mark> с основами <mark>HTML</mark> и <mark>CSS</mark>, применение стилей в соответствии с темой планирования заданий.
        </div>

        <div class="footer-note">
            ЛР выполнена Костылевым М.С.
        </div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
